<body data-page="shop">

<main id="top" data-pagemain="shop">

  <header class="page-head">
    <div class="wrap">
      <p class="kicker" data-reveal>The Range</p>
      <h1 class="page-title" data-reveal>One house, <em>one standard.</em></h1>
      <p class="lead" data-reveal>Five pillars under a single mark — browse, add to cart, and we close the order with an itemised quote over WhatsApp. Research peptides are Research&nbsp;Use&nbsp;Only, for qualified buyers.</p>
    </div>
  </header>

  <section class="sec sec-shop" id="shop">
    <div class="wrap">
      <div class="shop-tools" data-reveal>
        <div class="shop-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="shop-search" type="search" placeholder="Search compounds…" aria-label="Search products" autocomplete="off" spellcheck="false">
        </div>
        <label class="shop-sort"><span>Sort</span>
          <select id="shop-sort" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-asc">Price · low to high</option>
            <option value="price-desc">Price · high to low</option>
            <option value="name">Name · A–Z</option>
          </select>
        </label>
      </div>
      <div class="shop-bar" data-reveal>
        <div class="shop-chips" role="group" aria-label="Filter by pillar">
          <button class="shop-chip is-active" data-pillar="all" type="button">All</button>
          <button class="shop-chip" data-pillar="peptide" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flask"/></svg>Peptide Science</button>
          <button class="shop-chip" data-pillar="therapy" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg>Therapy &amp; Recovery</button>
          <button class="shop-chip" data-pillar="wellness" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg>Wellness</button>
          <button class="shop-chip" data-pillar="longevity" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-infinity"/></svg>Longevity</button>
          <button class="shop-chip" data-pillar="apparel" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tshirt"/></svg>Apparel</button>
        </div>
        <span class="shop-count" id="shop-count"></span>
      </div>
      <div class="shop-subbar" id="shop-subbar" hidden role="group" aria-label="Filter by category"></div>
      <div class="shop-grid" id="shop-grid" data-stagger></div>
    </div>
  </section>

</main>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="js/chrome.js" defer></script>
<script src="js/products.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
